<!-- Service Fee Catalog — Upgraded -->
<div id="view-service-fees" class="space-y-6 tab-view hidden">

  <!-- Header -->
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 glass-panel p-6 rounded-2xl border border-white/5">
    <div>
      <h2 class="text-xl font-bold text-white flex items-center gap-2"><span>💲</span> Service Fee Catalog</h2>
      <p class="text-xs text-slate-400 mt-1">Manage service rates, pricing tiers, and categories</p>
    </div>
    <div class="flex items-center gap-3">
      <button onclick="sfExportExcel()" class="bg-emerald-500/10 hover:bg-emerald-500/20 border border-emerald-500/20 text-emerald-400 font-bold text-xs px-3 py-2 rounded-xl transition flex items-center gap-1.5">
        <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Excel
      </button>
      <button onclick="sfBulkDelete()" id="sf-bulk-delete-btn" class="hidden bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/20 text-rose-400 font-bold text-xs px-3 py-2 rounded-xl transition flex items-center gap-1.5">
        🗑 Delete Selected (<span id="sf-selected-count">0</span>)
      </button>
      <button onclick="sfOpenAddForm()" class="bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-bold text-xs px-4 py-2.5 rounded-xl transition shadow-lg flex items-center gap-2">
        + Add Service Rate
      </button>
    </div>
  </div>

  <!-- Stats Cards -->
  <div class="grid grid-cols-2 md:grid-cols-4 gap-4" id="sf-stats-container">
    <div class="glass-panel p-4 rounded-2xl border border-white/5 text-center">
      <p class="text-[10px] text-slate-400 uppercase tracking-widest font-bold mb-1">Total Rates</p>
      <p class="text-2xl font-black text-white" id="sf-stat-total">—</p>
    </div>
    <div class="glass-panel p-4 rounded-2xl border border-emerald-500/20 text-center">
      <p class="text-[10px] text-slate-400 uppercase tracking-widest font-bold mb-1">Active</p>
      <p class="text-2xl font-black text-emerald-400" id="sf-stat-active">—</p>
    </div>
    <div class="glass-panel p-4 rounded-2xl border border-white/5 text-center">
      <p class="text-[10px] text-slate-400 uppercase tracking-widest font-bold mb-1">Categories</p>
      <p class="text-2xl font-black text-sky-400" id="sf-stat-categories">—</p>
    </div>
    <div class="glass-panel p-4 rounded-2xl border border-white/5 text-center">
      <p class="text-[10px] text-slate-400 uppercase tracking-widest font-bold mb-1">Avg Rate</p>
      <p class="text-2xl font-black text-amber-400" id="sf-stat-avg">—</p>
    </div>
  </div>

  <!-- Category Filter Chips + Search -->
  <div class="glass-panel p-4 rounded-2xl border border-white/5">
    <div class="flex flex-col md:flex-row md:items-center gap-3">
      <div class="flex flex-wrap gap-2 flex-1" id="sf-category-chips">
        <button onclick="sfFilterCategory('')" class="sf-chip active text-[10px] font-bold px-3 py-1.5 rounded-lg transition">All</button>
      </div>
      <div class="relative">
        <input type="text" id="sf-search" placeholder="Search rates..." oninput="sfDebouncedSearch()" class="bg-zinc-900 border border-white/10 rounded-xl px-3 py-2 pl-8 text-xs text-white focus:border-amber-500 focus:outline-none w-full md:w-56" />
        <svg class="absolute left-2.5 top-1/2 -translate-y-1/2 w-3 h-3 text-slate-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </div>
      <div class="flex items-center gap-2 text-[10px]">
        <label class="flex items-center gap-1.5 text-slate-400 cursor-pointer"><input type="checkbox" id="sf-show-inactive" onchange="sfLoadData()" class="rounded border-white/20" /> Show inactive</label>
      </div>
    </div>
  </div>

  <!-- Main Grid: Form + Table -->
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

    <!-- Left: Add/Edit Form (collapsible) -->
    <div class="lg:col-span-1">
      <div class="glass-panel rounded-2xl border border-white/5 overflow-hidden" id="sf-form-panel">
        <div class="flex items-center justify-between p-4 border-b border-white/5">
          <h3 class="text-sm font-bold text-white flex items-center gap-2" id="sf-form-title">
            <span class="w-2 h-2 rounded-full bg-amber-400"></span> Add Service Rate
          </h3>
          <button onclick="sfToggleForm()" class="text-slate-400 hover:text-white transition text-lg leading-none" id="sf-form-toggle">−</button>
        </div>
        <div class="p-4 space-y-3" id="sf-form-body">
          <input type="hidden" id="sf-id" value="" />

          <div>
            <label class="block text-[9px] text-slate-400 uppercase tracking-widest font-bold mb-1">Service Name</label>
            <input type="text" id="sf-service-type" required placeholder="e.g. CCTV Installation" class="w-full bg-zinc-900 border border-white/10 rounded-xl px-3 py-2 text-xs text-white focus:border-amber-500 focus:outline-none" />
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-[9px] text-slate-400 uppercase tracking-widest font-bold mb-1">Category</label>
              <select id="sf-category" class="w-full bg-zinc-900 border border-white/10 rounded-xl px-3 py-2 text-xs text-white focus:border-amber-500 focus:outline-none">
                <option value="CCTV">CCTV</option>
                <option value="Networking">Networking</option>
                <option value="WiFi">WiFi</option>
                <option value="NAS">NAS</option>
                <option value="Maintenance">Maintenance</option>
                <option value="General">General</option>
              </select>
            </div>
            <div>
              <label class="block text-[9px] text-slate-400 uppercase tracking-widest font-bold mb-1">Unit</label>
              <select id="sf-unit" class="w-full bg-zinc-900 border border-white/10 rounded-xl px-3 py-2 text-xs text-white focus:border-amber-500 focus:outline-none">
                <option value="per job">Per Job</option>
                <option value="per hour">Per Hour</option>
                <option value="per device">Per Device</option>
                <option value="per meter">Per Meter</option>
                <option value="per trip">Per Trip</option>
                <option value="fixed">Fixed</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-[9px] text-slate-400 uppercase tracking-widest font-bold mb-1">Rate Amount</label>
              <input type="number" step="0.01" id="sf-amount" required placeholder="0.00" class="w-full bg-zinc-900 border border-white/10 rounded-xl px-3 py-2 text-xs text-white focus:border-amber-500 focus:outline-none font-mono" />
            </div>
            <div>
              <label class="block text-[9px] text-slate-400 uppercase tracking-widest font-bold mb-1">Currency</label>
              <select id="sf-currency" class="w-full bg-zinc-900 border border-white/10 rounded-xl px-3 py-2 text-xs text-white focus:border-amber-500 focus:outline-none">
                <option value="MMK">MMK (K)</option>
                <option value="USD">USD ($)</option>
              </select>
            </div>
          </div>

          <div>
            <label class="block text-[9px] text-slate-400 uppercase tracking-widest font-bold mb-1">Min Charge</label>
            <input type="number" step="0.01" id="sf-min-charge" placeholder="0" class="w-full bg-zinc-900 border border-white/10 rounded-xl px-3 py-2 text-xs text-white focus:border-amber-500 focus:outline-none font-mono" />
          </div>

          <div>
            <label class="block text-[9px] text-slate-400 uppercase tracking-widest font-bold mb-1">Description</label>
            <textarea id="sf-desc" rows="2" placeholder="What this service covers..." class="w-full bg-zinc-900 border border-white/10 rounded-xl px-3 py-2 text-xs text-white focus:border-amber-500 focus:outline-none resize-none"></textarea>
          </div>

          <div class="flex items-center gap-3">
            <label class="flex items-center gap-2 text-slate-300 cursor-pointer text-xs">
              <input type="checkbox" id="sf-active" checked class="rounded border-white/20" /> Active
            </label>
            <div class="flex-1 text-right">
              <label class="text-[9px] text-slate-400 uppercase tracking-widest font-bold mr-2">Sort</label>
              <input type="number" id="sf-sort-order" value="0" class="w-16 bg-zinc-900 border border-white/10 rounded-lg px-2 py-1 text-xs text-white focus:border-amber-500 focus:outline-none font-mono text-center" />
            </div>
          </div>

          <div class="flex gap-2 pt-1">
            <button type="button" onclick="sfResetForm()" id="sf-cancel-btn" class="flex-1 bg-white/5 hover:bg-white/10 py-2.5 rounded-xl text-xs font-bold text-white uppercase tracking-wider transition hidden">Cancel</button>
            <button type="button" onclick="sfSubmit()" id="sf-submit-btn" class="flex-1 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 py-2.5 rounded-xl text-xs font-bold uppercase tracking-wider transition shadow-lg">Save Rate</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Right: Service Rates Table -->
    <div class="lg:col-span-2">
      <div class="glass-panel rounded-2xl border border-white/5 overflow-hidden">
        <div class="p-4 border-b border-white/5 flex items-center justify-between">
          <h3 class="text-sm font-bold text-white flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-sky-400"></span> Service Rates
            <span class="text-[10px] text-slate-500 font-normal" id="sf-count-label"></span>
          </h3>
          <div class="flex items-center gap-2">
            <label class="text-[10px] text-slate-400 flex items-center gap-1 cursor-pointer">
              <input type="checkbox" id="sf-select-all" onchange="sfToggleSelectAll()" class="rounded border-white/20" /> All
            </label>
          </div>
        </div>

        <!-- Category sub-headers rendered here -->
        <div id="sf-table-container" class="divide-y divide-white/5">
          <div class="p-8 text-center text-slate-600 text-xs">Loading service rates...</div>
        </div>
      </div>
    </div>
  </div>
</div>
