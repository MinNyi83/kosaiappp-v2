<div id="view-dispatch-map" class="space-y-6 tab-view">
  <!-- Header -->
  <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
    <div>
      <h1 class="text-2xl md:text-3xl font-black text-white uppercase tracking-tight flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-indigo-500/15 flex items-center justify-center">
          <svg class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
        </div>
        Dispatch Map
      </h1>
      <p class="text-sm text-slate-400 mt-1">Real-time crew tracking and geographic ticket routing</p>
    </div>
    <button onclick="mapCenterToHQ()" class="bg-amber-500/10 border border-amber-500/30 hover:bg-amber-500/20 text-amber-500 font-bold text-xs px-4 py-2.5 rounded-xl transition-all active:scale-95 flex items-center gap-2">
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
      Center to HQ
    </button>
  </div>

  <div class="grid lg:grid-cols-4 gap-6">
    <!-- Sidebar Controls panel -->
    <div class="lg:col-span-1 space-y-4">
      <!-- Map Theme Selector -->
      <div class="glass-panel p-5 rounded-2xl space-y-3">
        <h3 class="text-xs font-bold text-white uppercase tracking-wider flex items-center gap-2">
          <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
          Map Theme
        </h3>
        <div class="grid grid-cols-2 gap-2 text-[10px] font-bold">
          <button type="button" id="map-theme-dark" onclick="setMapTheme('dark')" class="bg-amber-500/10 border border-amber-500/30 text-amber-500 py-2.5 rounded-xl flex items-center justify-center gap-1.5">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
            Dark
          </button>
          <button type="button" id="map-theme-light" onclick="setMapTheme('light')" class="bg-white/5 border border-white/10 text-slate-400 hover:text-white py-2.5 rounded-xl flex items-center justify-center gap-1.5">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            Light
          </button>
        </div>
      </div>

      <!-- Plotted Marker Filters -->
      <div class="glass-panel p-5 rounded-2xl space-y-3">
        <h3 class="text-xs font-bold text-white uppercase tracking-wider flex items-center gap-2">
          <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
          Filter Tickets
        </h3>
        <div class="space-y-2">
          <button type="button" onclick="filterMapMarkers('all')" class="map-filter-btn w-full text-left bg-white/5 hover:bg-white/10 border border-white/10 text-white font-semibold text-xs px-3.5 py-2.5 rounded-xl transition flex items-center justify-between">
            <span>All Dispatches</span>
            <span class="bg-white/10 px-2 py-0.5 rounded font-mono text-[9px] text-slate-300" id="map-count-all">0</span>
          </button>
          <button type="button" onclick="filterMapMarkers('Pending')" class="map-filter-btn w-full text-left bg-amber-500/5 hover:bg-amber-500/10 border border-amber-500/10 text-amber-500 font-semibold text-xs px-3.5 py-2.5 rounded-xl transition flex items-center justify-between">
            <span class="flex items-center gap-2">
              <span class="w-2 h-2 rounded-full bg-amber-400"></span>
              Pending
            </span>
            <span class="bg-amber-500/10 px-2 py-0.5 rounded font-mono text-[9px]" id="map-count-pending">0</span>
          </button>
          <button type="button" onclick="filterMapMarkers('In Progress')" class="map-filter-btn w-full text-left bg-indigo-500/5 hover:bg-indigo-500/10 border border-indigo-500/10 text-indigo-400 font-semibold text-xs px-3.5 py-2.5 rounded-xl transition flex items-center justify-between">
            <span class="flex items-center gap-2">
              <span class="w-2 h-2 rounded-full bg-indigo-400"></span>
              In Progress
            </span>
            <span class="bg-indigo-500/10 px-2 py-0.5 rounded font-mono text-[9px]" id="map-count-progress">0</span>
          </button>
          <button type="button" onclick="filterMapMarkers('Completed')" class="map-filter-btn w-full text-left bg-emerald-500/5 hover:bg-emerald-500/10 border border-emerald-500/10 text-emerald-400 font-semibold text-xs px-3.5 py-2.5 rounded-xl transition flex items-center justify-between">
            <span class="flex items-center gap-2">
              <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
              Completed
            </span>
            <span class="bg-emerald-500/10 px-2 py-0.5 rounded font-mono text-[9px]" id="map-count-completed">0</span>
          </button>
        </div>
      </div>

      <!-- Locate active dispatches -->
      <div class="glass-panel p-5 rounded-2xl space-y-3">
        <h3 class="text-xs font-bold text-white uppercase tracking-wider flex items-center gap-2">
          <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
          Active Crews
        </h3>
        <div class="space-y-1.5 max-h-[160px] overflow-y-auto pr-1" id="map-active-crews-list">
          <!-- Populated dynamically -->
        </div>
      </div>
    </div>

    <!-- Big Map Canvas -->
    <div class="lg:col-span-3">
      <div class="glass-panel p-4 rounded-3xl h-[530px] flex flex-col">
        <div id="map" class="flex-1 rounded-2xl border border-white/5 overflow-hidden shadow-inner relative z-10"></div>
      </div>
    </div>
  </div>
</div>
