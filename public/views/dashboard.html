<!-- Dashboard — Clean Command Center -->
<div id="view-dashboard" class="space-y-6 tab-view">

  <!-- Welcome Banner -->
  <div class="glass-panel rounded-2xl p-5 relative overflow-hidden">
    <div class="absolute top-0 right-0 w-64 h-64 bg-gradient-to-bl from-amber-500/8 to-transparent rounded-full -mr-32 -mt-32"></div>
    <div class="relative flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
      <div>
        <p class="text-[10px] font-bold text-amber-500 uppercase tracking-[0.2em] mb-1" id="db-greeting">Good Morning</p>
        <h1 class="text-2xl font-black text-white tracking-tight">Command Center</h1>
        <p class="text-xs text-slate-400 mt-0.5" id="db-date"></p>
      </div>
      <div class="flex gap-2">
        <button onclick="switchTab('tickets')" class="bg-amber-500 hover:bg-amber-400 text-black font-extrabold text-xs px-5 py-2.5 rounded-xl shadow-lg transition-all active:scale-95 uppercase tracking-wider">+ New Ticket</button>
        <button onclick="dbRefresh()" class="bg-white/5 border border-white/10 hover:bg-white/10 text-slate-300 font-bold text-xs px-4 py-2.5 rounded-xl transition-all">↻ Refresh</button>
      </div>
    </div>
  </div>

  <!-- Stats Row — 4 cards -->
  <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
    <div class="glass-panel rounded-2xl p-5 group hover:scale-[1.02] transition-transform cursor-pointer" onclick="switchTab('tickets')">
      <div class="flex items-center justify-between mb-2">
        <div class="w-10 h-10 rounded-xl bg-blue-500/15 flex items-center justify-center"><svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2"/></svg></div>
        <span class="text-[10px] font-bold text-blue-400 bg-blue-500/10 px-2 py-0.5 rounded-full">ACTIVE</span>
      </div>
      <div class="text-3xl font-black text-white" id="db-stat-active">0</div>
      <div class="text-[10px] text-slate-400 mt-0.5">Open tickets</div>
    </div>
    <div class="glass-panel rounded-2xl p-5 group hover:scale-[1.02] transition-transform">
      <div class="flex items-center justify-between mb-2">
        <div class="w-10 h-10 rounded-xl bg-amber-500/15 flex items-center justify-center"><svg class="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8V7m0 10v1"/></svg></div>
        <span class="text-[10px] font-bold text-amber-400 bg-amber-500/10 px-2 py-0.5 rounded-full">MONTHLY</span>
      </div>
      <div class="text-3xl font-black text-white" id="db-stat-revenue">$0</div>
      <div class="text-[10px] text-amber-500 mt-0.5 font-mono" id="db-stat-revenue-mmk">0 MMK</div>
    </div>
    <div class="glass-panel rounded-2xl p-5 group hover:scale-[1.02] transition-transform cursor-pointer" onclick="switchTab('amc')">
      <div class="flex items-center justify-between mb-2">
        <div class="w-10 h-10 rounded-xl bg-emerald-500/15 flex items-center justify-center"><svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg></div>
        <span class="text-[10px] font-bold text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded-full">CLIENTS</span>
      </div>
      <div class="text-3xl font-black text-white" id="db-stat-clients">0</div>
      <div class="text-[10px] text-slate-400 mt-0.5">Total registered</div>
    </div>
    <div class="glass-panel rounded-2xl p-5 group hover:scale-[1.02] transition-transform cursor-pointer" onclick="switchTab('tickets')">
      <div class="flex items-center justify-between mb-2">
        <div class="w-10 h-10 rounded-xl bg-violet-500/15 flex items-center justify-center"><svg class="w-5 h-5 text-violet-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg></div>
        <span class="text-[10px] font-bold text-violet-400 bg-violet-500/10 px-2 py-0.5 rounded-full">FIELD</span>
      </div>
      <div class="text-3xl font-black text-white" id="db-stat-techs">0</div>
      <div class="text-[10px] text-slate-400 mt-0.5">Engineers on site</div>
    </div>
  </div>

  <!-- Main Grid -->
  <div class="grid lg:grid-cols-3 gap-6">
    <!-- Recent Tickets -->
    <div class="lg:col-span-2 glass-panel rounded-2xl overflow-hidden">
      <div class="p-4 pb-0 flex items-center justify-between">
        <div>
          <h2 class="text-sm font-bold text-white uppercase tracking-wider">Recent Dispatches</h2>
          <p class="text-[10px] text-slate-500 mt-0.5">Latest active service orders</p>
        </div>
        <button onclick="switchTab('tickets')" class="text-[10px] font-bold text-amber-500 hover:text-amber-400 px-3 py-1.5 rounded-lg hover:bg-amber-500/10 transition-all">View All →</button>
      </div>
      <div class="p-4" id="db-today-list">
        <div class="text-center text-slate-600 text-xs py-6">Loading...</div>
      </div>
    </div>

    <!-- Right Column -->
    <div class="space-y-6">
      <!-- Quick Actions -->
      <div class="glass-panel rounded-2xl p-4">
        <h3 class="text-xs font-bold text-white uppercase tracking-wider mb-3">Quick Actions</h3>
        <div class="grid grid-cols-2 gap-2">
          <button onclick="switchTab('tickets')" class="flex flex-col items-center gap-1.5 p-3 rounded-xl bg-blue-500/10 border border-blue-500/20 hover:bg-blue-500/20 transition-all">
            <svg class="w-4 h-4 text-blue-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 4.5v15m7.5-7.5h-15"/></svg>
            <span class="text-[9px] font-bold text-blue-400 uppercase">New Ticket</span>
          </button>
          <button onclick="switchTab('amc')" class="flex flex-col items-center gap-1.5 p-3 rounded-xl bg-emerald-500/10 border border-emerald-500/20 hover:bg-emerald-500/20 transition-all">
            <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 1H4a2 2 0 00-2 2v10a2 2 0 002 2h14a2 2 0 002-2v-5a2 2 0 00-2-2h-3a4 4 0 01-4-4z"/></svg>
            <span class="text-[9px] font-bold text-emerald-400 uppercase">Add Client</span>
          </button>
          <button onclick="switchTab('surveys')" class="flex flex-col items-center gap-1.5 p-3 rounded-xl bg-violet-500/10 border border-violet-500/20 hover:bg-violet-500/20 transition-all">
            <svg class="w-4 h-4 text-violet-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
            <span class="text-[9px] font-bold text-violet-400 uppercase">Survey</span>
          </button>
          <button onclick="switchTab('inventory')" class="flex flex-col items-center gap-1.5 p-3 rounded-xl bg-amber-500/10 border border-amber-500/20 hover:bg-amber-500/20 transition-all">
            <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
            <span class="text-[9px] font-bold text-amber-400 uppercase">Inventory</span>
          </button>
        </div>
      </div>

      <!-- Top Technicians -->
      <div class="glass-panel rounded-2xl p-4">
        <h3 class="text-xs font-bold text-white uppercase tracking-wider mb-3">Top Technicians</h3>
        <div class="space-y-2" id="db-top-techs">
          <div class="text-center text-slate-600 text-xs py-4">Loading...</div>
        </div>
      </div>

      <!-- Activity Feed -->
      <div class="glass-panel rounded-2xl p-4">
        <h3 class="text-xs font-bold text-white uppercase tracking-wider mb-3">Recent Activity</h3>
        <div class="space-y-1.5 max-h-56 overflow-y-auto" id="db-activity-feed">
          <div class="text-center text-slate-600 text-xs py-4">Loading...</div>
        </div>
      </div>
    </div>
  </div>
</div>
