<!-- Clients Directory — Upgraded -->
<div id="view-amc" class="space-y-6 tab-view hidden">

  <!-- Header -->
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 glass-panel p-6 rounded-2xl border border-white/5">
    <div>
      <h2 class="text-xl font-bold text-white flex items-center gap-2"><span>👥</span> Clients Directory</h2>
      <p class="text-xs text-slate-400 mt-1">Manage client profiles, AMC contracts, and service history</p>
    </div>
    <div class="flex items-center gap-3">
      <button onclick="cdExportExcel()" class="bg-emerald-500/10 hover:bg-emerald-500/20 border border-emerald-500/20 text-emerald-400 font-bold text-xs px-3 py-2 rounded-xl transition flex items-center gap-1.5">
        <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Excel
      </button>
      <button onclick="cdBulkDelete()" id="cd-bulk-delete-btn" class="hidden bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/20 text-rose-400 font-bold text-xs px-3 py-2 rounded-xl transition flex items-center gap-1.5">
        🗑 Delete Selected (<span id="cd-selected-count">0</span>)
      </button>
      <button onclick="cdOpenAddForm()" class="bg-gradient-to-r from-emerald-500 to-emerald-600 hover:from-emerald-400 hover:to-emerald-500 text-slate-950 font-bold text-xs px-4 py-2.5 rounded-xl transition shadow-lg flex items-center gap-2">
        + Add Client
      </button>
    </div>
  </div>

  <!-- Stats Cards -->
  <div class="grid grid-cols-2 md:grid-cols-5 gap-4" id="cd-stats-container">
    <div class="glass-panel p-4 rounded-2xl border border-white/5 text-center cursor-pointer hover:border-amber-500/30 transition" onclick="cdFilterStatus('')">
      <p class="text-[10px] text-slate-400 uppercase tracking-widest font-bold mb-1">Total</p>
      <p class="text-2xl font-black text-white" id="cd-stat-total">—</p>
    </div>
    <div class="glass-panel p-4 rounded-2xl border border-emerald-500/20 text-center cursor-pointer hover:border-emerald-500/40 transition" onclick="cdFilterStatus('Active')">
      <p class="text-[10px] text-emerald-400 uppercase tracking-widest font-bold mb-1">Active</p>
      <p class="text-2xl font-black text-emerald-400" id="cd-stat-active">—</p>
    </div>
    <div class="glass-panel p-4 rounded-2xl border border-rose-500/20 text-center cursor-pointer hover:border-rose-500/40 transition" onclick="cdFilterStatus('Expired')">
      <p class="text-[10px] text-rose-400 uppercase tracking-widest font-bold mb-1">Expired</p>
      <p class="text-2xl font-black text-rose-400" id="cd-stat-expired">—</p>
    </div>
    <div class="glass-panel p-4 rounded-2xl border border-white/5 text-center cursor-pointer hover:border-sky-500/30 transition" onclick="cdFilterStatus('Inactive')">
      <p class="text-[10px] text-slate-400 uppercase tracking-widest font-bold mb-1">Inactive</p>
      <p class="text-2xl font-black text-sky-400" id="cd-stat-inactive">—</p>
    </div>
    <div class="glass-panel p-4 rounded-2xl border border-amber-500/20 text-center cursor-pointer hover:border-amber-500/40 transition" onclick="cdFilterPriority('VIP')">
      <p class="text-[10px] text-amber-400 uppercase tracking-widest font-bold mb-1">VIP</p>
      <p class="text-2xl font-black text-amber-400" id="cd-stat-vip">—</p>
    </div>
  </div>

  <!-- Filter Bar -->
  <div class="glass-panel p-4 rounded-2xl border border-white/5">
    <div class="flex flex-col md:flex-row md:items-center gap-3">
      <!-- Type tabs -->
      <div class="flex gap-1">
        <button onclick="cdFilterType('')" id="cd-type-all" class="cd-type-btn active text-[10px] font-bold px-3 py-1.5 rounded-lg transition">All</button>
        <button onclick="cdFilterType('Corporate')" id="cd-type-corporate" class="cd-type-btn text-[10px] font-bold px-3 py-1.5 rounded-lg transition">🏢 Corporate</button>
        <button onclick="cdFilterType('Individual')" id="cd-type-individual" class="cd-type-btn text-[10px] font-bold px-3 py-1.5 rounded-lg transition">👤 Individual</button>
      </div>

      <!-- Tag chips -->
      <div class="flex flex-wrap gap-1.5 flex-1" id="cd-tag-chips"></div>

      <!-- Search -->
      <div class="relative">
        <input type="text" id="cd-search" placeholder="Search clients..." oninput="cdDebouncedSearch()" class="bg-zinc-900 border border-white/10 rounded-xl px-3 py-2 pl-8 text-xs text-white focus:border-emerald-500 focus:outline-none w-full md:w-56" />
        <svg class="absolute left-2.5 top-1/2 -translate-y-1/2 w-3 h-3 text-slate-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </div>

      <!-- Sort -->
      <select id="cd-sort" onchange="cdLoadData()" class="bg-zinc-900 border border-white/10 rounded-xl px-3 py-2 text-[10px] text-slate-300 focus:border-emerald-500 focus:outline-none">
        <option value="name-asc">Name A-Z</option>
        <option value="name-desc">Name Z-A</option>
        <option value="newest">Newest</option>
        <option value="expiry">Expiry Soon</option>
        <option value="revenue">Top Revenue</option>
        <option value="jobs">Most Jobs</option>
        <option value="priority">Priority</option>
      </select>

      <!-- View toggle -->
      <div class="flex border border-white/10 rounded-lg overflow-hidden">
        <button onclick="cdSetView('table')" id="cd-view-table" class="px-2.5 py-1.5 text-[10px] font-bold bg-emerald-500/20 text-emerald-400 transition">☰</button>
        <button onclick="cdSetView('cards')" id="cd-view-cards" class="px-2.5 py-1.5 text-[10px] font-bold text-slate-400 hover:text-white transition">⊞</button>
      </div>
    </div>
  </div>

  <!-- Table View -->
  <div id="cd-table-view">
    <div class="glass-panel rounded-2xl border border-white/5 overflow-hidden">
      <div class="p-4 border-b border-white/5 flex items-center justify-between">
        <h3 class="text-sm font-bold text-white flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-emerald-400"></span> Client Records
          <span class="text-[10px] text-slate-500 font-normal" id="cd-count-label"></span>
        </h3>
        <label class="text-[10px] text-slate-400 flex items-center gap-1 cursor-pointer">
          <input type="checkbox" id="cd-select-all" onchange="cdToggleSelectAll()" class="rounded border-white/20" /> All
        </label>
      </div>
      <div id="cd-table-container" class="divide-y divide-white/5">
        <div class="p-8 text-center text-slate-600 text-xs">Loading clients...</div>
      </div>
    </div>
  </div>

  <!-- Cards View (hidden by default) -->
  <div id="cd-cards-view" class="hidden">
    <div id="cd-cards-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
  </div>
</div>

<!-- Client Detail Modal -->
<div id="cd-detail-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
  <div class="glass-panel p-6 rounded-3xl shadow-2xl max-w-3xl w-full border border-white/10 max-h-[90vh] overflow-y-auto">
    <div class="flex justify-between items-start border-b border-white/5 pb-4 mb-4">
      <div>
        <p class="text-[10px] text-slate-500 font-mono" id="cd-detail-id"></p>
        <h2 class="text-lg font-black text-white" id="cd-detail-name"></h2>
        <div class="flex items-center gap-2 mt-1" id="cd-detail-badges"></div>
      </div>
      <button onclick="cdCloseDetail()" class="text-slate-400 hover:text-white transition text-lg leading-none p-1">✕</button>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="space-y-4">
        <div>
          <p class="text-[9px] text-slate-400 uppercase tracking-widest font-bold mb-1">Contact</p>
          <div class="space-y-1 text-xs text-slate-300" id="cd-detail-contact"></div>
        </div>
        <div>
          <p class="text-[9px] text-slate-400 uppercase tracking-widest font-bold mb-1">AMC Contract</p>
          <div class="space-y-1 text-xs text-slate-300" id="cd-detail-amc"></div>
        </div>
        <div>
          <p class="text-[9px] text-slate-400 uppercase tracking-widest font-bold mb-1">Tags</p>
          <div class="flex flex-wrap gap-1" id="cd-detail-tags"></div>
        </div>
      </div>
      <div class="space-y-4">
        <div>
          <p class="text-[9px] text-slate-400 uppercase tracking-widest font-bold mb-1">Stats</p>
          <div class="grid grid-cols-2 gap-2" id="cd-detail-stats"></div>
        </div>
        <div>
          <p class="text-[9px] text-slate-400 uppercase tracking-widest font-bold mb-1">Notes</p>
          <p class="text-xs text-slate-400" id="cd-detail-notes">No notes.</p>
        </div>
        <div>
          <p class="text-[9px] text-slate-400 uppercase tracking-widest font-bold mb-2">Service History</p>
          <div id="cd-detail-history" class="space-y-2 max-h-48 overflow-y-auto"></div>
        </div>
      </div>
    </div>
    <div class="flex gap-2 mt-6 pt-4 border-t border-white/5">
      <button onclick="cdEditFromDetail()" class="flex-1 bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/20 text-amber-400 font-bold text-xs py-2.5 rounded-xl transition">✏️ Edit</button>
      <button onclick="cdDeleteFromDetail()" class="flex-1 bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/20 text-rose-400 font-bold text-xs py-2.5 rounded-xl transition">🗑 Delete</button>
    </div>
  </div>
</div>

<!-- Client Add/Edit Form Modal -->
<div id="cd-form-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
  <div class="glass-panel p-6 rounded-3xl shadow-2xl max-w-lg w-full border border-white/10 max-h-[90vh] overflow-y-auto">
    <div class="flex justify-between items-center border-b border-white/5 pb-4 mb-4">
      <h2 class="text-sm font-bold text-white flex items-center gap-2" id="cd-form-title">
        <span class="w-2 h-2 rounded-full bg-emerald-400"></span> Add Client
      </h2>
      <button onclick="cdCloseForm()" class="text-slate-400 hover:text-white transition text-lg leading-none p-1">✕</button>
    </div>
    <div class="space-y-3">
      <input type="hidden" id="cd-form-id" value="" />
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-[9px] text-slate-400 uppercase tracking-widest font-bold mb-1">Company Name *</label>
          <input type="text" id="cd-form-company" required placeholder="Company name" class="w-full bg-zinc-900 border border-white/10 rounded-xl px-3 py-2 text-xs text-white focus:border-emerald-500 focus:outline-none" />
        </div>
        <div>
          <label class="block text-[9px] text-slate-400 uppercase tracking-widest font-bold mb-1">Contact Person</label>
          <input type="text" id="cd-form-contact" placeholder="Manager name" class="w-full bg-zinc-900 border border-white/10 rounded-xl px-3 py-2 text-xs text-white focus:border-emerald-500 focus:outline-none" />
        </div>
      </div>
      <div>
        <label class="block text-[9px] text-slate-400 uppercase tracking-widest font-bold mb-1">Address *</label>
        <input type="text" id="cd-form-address" required placeholder="Installation address" class="w-full bg-zinc-900 border border-white/10 rounded-xl px-3 py-2 text-xs text-white focus:border-emerald-500 focus:outline-none" />
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-[9px] text-slate-400 uppercase tracking-widest font-bold mb-1">Phone</label>
          <input type="text" id="cd-form-phone" placeholder="+95 9 XXX XXX XXX" class="w-full bg-zinc-900 border border-white/10 rounded-xl px-3 py-2 text-xs text-white focus:border-emerald-500 focus:outline-none font-mono" />
        </div>
        <div>
          <label class="block text-[9px] text-slate-400 uppercase tracking-widest font-bold mb-1">Email</label>
          <input type="email" id="cd-form-email" placeholder="email@company.com" class="w-full bg-zinc-900 border border-white/10 rounded-xl px-3 py-2 text-xs text-white focus:border-emerald-500 focus:outline-none" />
        </div>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-[9px] text-slate-400 uppercase tracking-widest font-bold mb-1">Client Type</label>
          <select id="cd-form-type" class="w-full bg-zinc-900 border border-white/10 rounded-xl px-3 py-2 text-xs text-white focus:border-emerald-500 focus:outline-none">
            <option value="Corporate">🏢 Corporate</option>
            <option value="Individual">👤 Individual</option>
          </select>
        </div>
        <div>
          <label class="block text-[9px] text-slate-400 uppercase tracking-widest font-bold mb-1">Priority</label>
          <select id="cd-form-priority" class="w-full bg-zinc-900 border border-white/10 rounded-xl px-3 py-2 text-xs text-white focus:border-emerald-500 focus:outline-none">
            <option value="Normal">Normal</option>
            <option value="High">High</option>
            <option value="VIP">VIP</option>
            <option value="Low">Low</option>
          </select>
        </div>
      </div>
      <div class="grid grid-cols-3 gap-3">
        <div>
          <label class="block text-[9px] text-slate-400 uppercase tracking-widest font-bold mb-1">AMC Status</label>
          <select id="cd-form-status" class="w-full bg-zinc-900 border border-white/10 rounded-xl px-3 py-2 text-xs text-white focus:border-emerald-500 focus:outline-none">
            <option value="Active">Active</option>
            <option value="Inactive" selected>Inactive</option>
            <option value="Expired">Expired</option>
            <option value="No AMC">No AMC</option>
            <option value="Individual">Individual</option>
          </select>
        </div>
        <div>
          <label class="block text-[9px] text-slate-400 uppercase tracking-widest font-bold mb-1">AMC Start</label>
          <input type="date" id="cd-form-start" class="w-full bg-zinc-900 border border-white/10 rounded-xl px-3 py-2 text-xs text-white focus:border-emerald-500 focus:outline-none font-mono" />
        </div>
        <div>
          <label class="block text-[9px] text-slate-400 uppercase tracking-widest font-bold mb-1">AMC End</label>
          <input type="date" id="cd-form-end" class="w-full bg-zinc-900 border border-white/10 rounded-xl px-3 py-2 text-xs text-white focus:border-emerald-500 focus:outline-none font-mono" />
        </div>
      </div>
      <div>
        <label class="block text-[9px] text-slate-400 uppercase tracking-widest font-bold mb-1">Tags (comma-separated)</label>
        <input type="text" id="cd-form-tags" placeholder="vip, priority, renewal-needed" class="w-full bg-zinc-900 border border-white/10 rounded-xl px-3 py-2 text-xs text-white focus:border-emerald-500 focus:outline-none" />
      </div>
      <div>
        <label class="block text-[9px] text-slate-400 uppercase tracking-widest font-bold mb-1">Notes</label>
        <textarea id="cd-form-notes" rows="2" placeholder="Internal notes about this client..." class="w-full bg-zinc-900 border border-white/10 rounded-xl px-3 py-2 text-xs text-white focus:border-emerald-500 focus:outline-none resize-none"></textarea>
      </div>
      <div class="flex gap-2 pt-2">
        <button onclick="cdCloseForm()" class="flex-1 bg-white/5 hover:bg-white/10 py-2.5 rounded-xl text-xs font-bold text-white uppercase tracking-wider transition">Cancel</button>
        <button onclick="cdSubmit()" class="flex-1 bg-gradient-to-r from-emerald-500 to-emerald-600 hover:from-emerald-400 hover:to-emerald-500 text-slate-950 py-2.5 rounded-xl text-xs font-bold uppercase tracking-wider transition shadow-lg">Save Client</button>
      </div>
    </div>
  </div>
</div>

<style>
  .cd-type-btn {
    background: rgba(255,255,255,0.04);
    color: #94a3b8;
    border: 1px solid rgba(255,255,255,0.06);
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
  }
  .cd-type-btn:hover { background: rgba(255,255,255,0.08); color: #e2e8f0; }
  .cd-type-btn.active {
    background: rgba(16,185,129,0.15);
    color: #34d399;
    border-color: rgba(16,185,129,0.3);
    font-weight: 700;
  }
  .cd-tag-chip {
    background: rgba(255,255,255,0.04);
    color: #94a3b8;
    border: 1px solid rgba(255,255,255,0.06);
    cursor: pointer;
    transition: all 0.15s;
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 6px;
  }
  .cd-tag-chip:hover { background: rgba(255,255,255,0.08); }
  .cd-tag-chip.active {
    background: rgba(139,92,246,0.15);
    color: #a78bfa;
    border-color: rgba(139,92,246,0.3);
  }
</style>
