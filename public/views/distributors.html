<div id="view-distributors" class="space-y-6 tab-view">
  <!-- Header -->
  <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
    <div>
      <h1 class="text-2xl md:text-3xl font-black text-white uppercase tracking-tight flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-cyan-500/15 flex items-center justify-center">
          <svg class="w-5 h-5 text-cyan-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </div>
        Distributors
      </h1>
      <p class="text-sm text-slate-400 mt-1">Manage procurement channels for spare parts & equipment</p>
    </div>
    <button onclick="openAddDistributorModal()" class="bg-amber-500 hover:bg-amber-400 text-black text-xs font-bold uppercase tracking-wider px-4 py-2.5 rounded-xl transition shadow-md flex items-center gap-1.5">
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Add Distributor
    </button>
  </div>

  <!-- Stats Cards -->
  <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
    <div class="glass-panel rounded-2xl p-5 relative overflow-hidden group hover:border-cyan-500/30 transition-all">
      <div class="absolute top-0 left-0 w-1 h-full bg-gradient-to-b from-cyan-400 to-cyan-600 rounded-l-2xl"></div>
      <div class="flex justify-between items-start mb-3">
        <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Total Distributors</span>
        <div class="w-9 h-9 rounded-xl bg-cyan-500/10 flex items-center justify-center">
          <svg class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
        </div>
      </div>
      <span class="text-3xl font-black text-cyan-400" id="dist-total">0</span>
    </div>
    <div class="glass-panel rounded-2xl p-5 relative overflow-hidden group hover:border-amber-500/30 transition-all">
      <div class="absolute top-0 left-0 w-1 h-full bg-gradient-to-b from-amber-400 to-amber-600 rounded-l-2xl"></div>
      <div class="flex justify-between items-start mb-3">
        <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Active This Month</span>
        <div class="w-9 h-9 rounded-xl bg-amber-500/10 flex items-center justify-center">
          <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        </div>
      </div>
      <span class="text-3xl font-black text-amber-400" id="dist-active">0</span>
    </div>
    <div class="glass-panel rounded-2xl p-5 relative overflow-hidden group hover:border-emerald-500/30 transition-all">
      <div class="absolute top-0 left-0 w-1 h-full bg-gradient-to-b from-emerald-400 to-emerald-600 rounded-l-2xl"></div>
      <div class="flex justify-between items-start mb-3">
        <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Product Lines</span>
        <div class="w-9 h-9 rounded-xl bg-emerald-500/10 flex items-center justify-center">
          <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v16"/></svg>
        </div>
      </div>
      <span class="text-3xl font-black text-emerald-400" id="dist-products">0</span>
    </div>
    <div class="glass-panel rounded-2xl p-5 relative overflow-hidden group hover:border-violet-500/30 transition-all">
      <div class="absolute top-0 left-0 w-1 h-full bg-gradient-to-b from-violet-400 to-violet-600 rounded-l-2xl"></div>
      <div class="flex justify-between items-start mb-3">
        <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">With Contact Info</span>
        <div class="w-9 h-9 rounded-xl bg-violet-500/10 flex items-center justify-center">
          <svg class="w-4 h-4 text-violet-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72"/></svg>
        </div>
      </div>
      <span class="text-3xl font-black text-violet-400" id="dist-with-contact">0</span>
    </div>
  </div>

  <!-- Search & Export -->
  <div class="glass-panel rounded-2xl overflow-hidden">
    <div class="p-5 pb-3 flex items-center justify-between gap-4 flex-wrap">
      <div class="flex items-center gap-2 flex-1 min-w-[200px]">
        <div class="relative flex-1 max-w-xs">
          <svg class="w-3.5 h-3.5 text-slate-500 absolute left-3 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input id="distributor-search-input" onkeyup="filterDistributors()" placeholder="Search distributors..." class="w-full bg-white/5 border border-white/10 rounded-xl pl-9 pr-4 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-amber-500 transition-all"/>
        </div>
      </div>
      <div class="flex gap-2">
        <button onclick="exportTableToExcel('distributors-table', 'Distributors')" class="flex items-center gap-1.5 px-3 py-2 text-[10px] font-bold text-emerald-400 border border-emerald-500/20 hover:bg-emerald-500/10 rounded-xl transition-all">
          <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Excel
        </button>
      </div>
    </div>
    <div class="overflow-x-auto">
      <table id="distributors-table" class="w-full text-xs text-left">
        <thead>
          <tr class="text-slate-500 border-b border-white/5 uppercase tracking-widest text-[9px]">
            <th class="px-5 py-3 font-semibold">Distributor</th>
            <th class="px-5 py-3 font-semibold">Contact</th>
            <th class="px-5 py-3 font-semibold">Phone</th>
            <th class="px-5 py-3 font-semibold">Email</th>
            <th class="px-5 py-3 font-semibold">Product Lines</th>
            <th class="px-5 py-3 font-semibold text-right">Actions</th>
          </tr>
        </thead>
        <tbody id="distributors-list-body" class="divide-y divide-white/5">
          <tr><td colspan="6" class="py-12 text-center text-slate-500">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- MODAL: ADD DISTRIBUTOR -->
<div
  id="modal-add-distributor"
  class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center hidden"
>
  <div class="glass-panel rounded-2xl overflow-hidden max-w-md w-full space-y-4 border border-white/10">
    <div class="flex justify-between items-center">
      <h3 class="text-sm font-bold text-white uppercase tracking-wider">Add Distributor</h3>
      <button onclick="closeAddDistributorModal()" class="text-slate-400 hover:text-white">
        ✕
      </button>
    </div>
    <form method="POST" onsubmit="submitAddDistributor(event)" class="space-y-3">
      <div class="space-y-1">
        <label class="block text-[9px] font-bold text-slate-400 uppercase tracking-widest"
          >Distributor Name</label
        >
        <input
          type="text"
          name="name"
          required
          placeholder="e.g. Elite CCTV & IT Distribution"
          class="w-full bg-black/40 border border-white/10 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-500"
        />
      </div>
      <div class="space-y-1">
        <label class="block text-[9px] font-bold text-slate-400 uppercase tracking-widest"
          >Contact Person</label
        >
        <input
          type="text"
          name="contact_person"
          required
          placeholder="e.g. Ko Hlaing"
          class="w-full bg-black/40 border border-white/10 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-500"
        />
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div class="space-y-1">
          <label class="block text-[9px] font-bold text-slate-400 uppercase tracking-widest"
            >Phone</label
          >
          <input
            type="text"
            name="phone"
            required
            placeholder="e.g. 09-443882991"
            class="w-full bg-black/40 border border-white/10 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-500"
          />
        </div>
        <div class="space-y-1">
          <label class="block text-[9px] font-bold text-slate-400 uppercase tracking-widest"
            >Email</label
          >
          <input
            type="email"
            name="email"
            required
            placeholder="sales@elitecctv.com.mm"
            class="w-full bg-black/40 border border-white/10 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-500"
          />
        </div>
      </div>
      <div class="space-y-1">
        <label class="block text-[9px] font-bold text-slate-400 uppercase tracking-widest"
          >Product Lines Supplied</label
        >
        <input
          type="text"
          name="product_lines"
          required
          placeholder="e.g. Hikvision, Dahua, Ruijie"
          class="w-full bg-black/40 border border-white/10 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-500"
        />
      </div>
      <button
        type="submit"
        class="w-full bg-amber-600 hover:bg-amber-500 py-2.5 rounded-xl text-xs font-bold text-black uppercase tracking-wider transition"
      >
        Save Distributor
      </button>
    </form>
  </div>
</div>
